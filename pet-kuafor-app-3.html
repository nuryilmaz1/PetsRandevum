<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1a1a2e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>🐾 Pet Kuaför</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f0f1a;
    --card: #1a1a2e;
    --card2: #16213e;
    --accent: #e8a87c;
    --accent2: #c77dff;
    --text: #f0ece2;
    --muted: #8a8a9a;
    --success: #56cfe1;
    --danger: #ff6b6b;
    --border: rgba(232,168,124,0.18);
    --radius: 18px;
    --shadow: 0 8px 32px rgba(0,0,0,0.4);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }
  /* HEADER */
  .app-header {
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
    border-bottom: 1px solid var(--border);
    padding: 16px 20px 12px;
    position: sticky; top: 0; z-index: 100;
    display: flex; align-items: center; justify-content: space-between;
  }
  .app-header h1 {
    font-family: 'Playfair Display', serif;
    font-size: 22px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .btn-new {
    background: linear-gradient(135deg, var(--accent), #d4956a);
    color: #1a1a2e;
    border: none; border-radius: 50px;
    padding: 9px 18px;
    font-family: 'DM Sans', sans-serif;
    font-weight: 600; font-size: 14px;
    cursor: pointer;
    display: flex; align-items: center; gap: 6px;
    box-shadow: 0 4px 15px rgba(232,168,124,0.35);
    transition: transform 0.15s, box-shadow 0.15s;
  }
  .btn-new:active { transform: scale(0.96); }

  /* NAV */
  .bottom-nav {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: var(--card);
    border-top: 1px solid var(--border);
    display: flex;
    z-index: 100;
    padding-bottom: env(safe-area-inset-bottom);
  }
  .nav-item {
    flex: 1; display: flex; flex-direction: column; align-items: center;
    padding: 10px 0 8px;
    cursor: pointer; border: none; background: none;
    color: var(--muted); font-size: 11px; font-family: 'DM Sans', sans-serif;
    transition: color 0.2s;
  }
  .nav-item.active { color: var(--accent); }
  .nav-item .icon { font-size: 22px; margin-bottom: 2px; }

  /* PAGES */
  .page { display: none; padding: 16px 16px 90px; }
  .page.active { display: block; }

  /* CARDS */
  .appt-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 12px;
    cursor: pointer;
    transition: transform 0.15s, border-color 0.2s;
    position: relative;
    overflow: hidden;
  }
  .appt-card::before {
    content: '';
    position: absolute; left: 0; top: 0; bottom: 0;
    width: 3px;
    background: linear-gradient(180deg, var(--accent), var(--accent2));
  }
  .appt-card:active { transform: scale(0.98); }
  .appt-card.completed::before { background: var(--success); }
  .appt-card.pending::before { background: var(--accent); }

  .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
  .dog-name { font-family: 'Playfair Display', serif; font-size: 18px; color: var(--accent); }
  .badge {
    font-size: 11px; padding: 3px 10px; border-radius: 20px;
    font-weight: 600;
  }
  .badge.completed { background: rgba(86,207,225,0.15); color: var(--success); }
  .badge.pending { background: rgba(232,168,124,0.15); color: var(--accent); }

  .card-row { display: flex; gap: 16px; flex-wrap: wrap; }
  .card-info { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
  .card-info strong { color: var(--text); }

  /* STATS */
  .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
  .stat-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    text-align: center;
  }
  .stat-num {
    font-family: 'Playfair Display', serif;
    font-size: 28px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .stat-label { font-size: 12px; color: var(--muted); margin-top: 4px; }

  /* MODAL */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.75);
    backdrop-filter: blur(4px);
    z-index: 200;
    display: none;
    align-items: flex-end;
    justify-content: center;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--card2);
    border-radius: 24px 24px 0 0;
    width: 100%; max-width: 600px;
    max-height: 92vh;
    overflow-y: auto;
    padding: 0 0 env(safe-area-inset-bottom);
    animation: slideUp 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  .modal-handle {
    width: 40px; height: 4px;
    background: var(--border);
    border-radius: 2px;
    margin: 12px auto 0;
  }
  .modal-title {
    font-family: 'Playfair Display', serif;
    font-size: 20px;
    color: var(--accent);
    padding: 16px 20px 0;
  }
  .modal-body { padding: 16px 20px 20px; }

  /* FORM */
  .form-section {
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px;
    margin-bottom: 14px;
  }
  .form-section-title {
    font-size: 12px;
    color: var(--accent2);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 12px;
  }
  label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; margin-top: 10px; }
  label:first-of-type { margin-top: 0; }
  input, select, textarea {
    width: 100%;
    background: rgba(255,255,255,0.06);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    padding: 11px 14px;
    outline: none;
    transition: border-color 0.2s;
    -webkit-appearance: none;
  }
  input:focus, select:focus, textarea:focus { border-color: var(--accent); }
  select option { background: var(--card2); }
  textarea { resize: vertical; min-height: 70px; }

  .input-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  /* PHOTO UPLOAD */
  .photo-upload-area {
    border: 2px dashed var(--border);
    border-radius: 12px;
    padding: 20px;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.2s;
    position: relative;
  }
  .photo-upload-area:active { border-color: var(--accent); }
  .photo-upload-area input[type=file] {
    position: absolute; inset: 0; opacity: 0; cursor: pointer;
    width: 100%; height: 100%;
  }
  .photo-preview {
    width: 100%; border-radius: 10px;
    max-height: 180px; object-fit: cover;
    margin-top: 8px;
  }
  .photo-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  /* BUTTONS */
  .btn-primary {
    width: 100%;
    background: linear-gradient(135deg, var(--accent), #d4956a);
    color: #1a1a2e;
    border: none; border-radius: 14px;
    padding: 15px;
    font-family: 'DM Sans', sans-serif;
    font-weight: 700; font-size: 16px;
    cursor: pointer;
    box-shadow: 0 4px 20px rgba(232,168,124,0.4);
    margin-top: 16px;
    transition: transform 0.15s;
  }
  .btn-primary:active { transform: scale(0.98); }
  .btn-danger {
    width: 100%;
    background: rgba(255,107,107,0.15);
    color: var(--danger);
    border: 1px solid rgba(255,107,107,0.3);
    border-radius: 14px;
    padding: 13px;
    font-family: 'DM Sans', sans-serif;
    font-weight: 600; font-size: 15px;
    cursor: pointer;
    margin-top: 8px;
  }
  .btn-secondary {
    width: 100%;
    background: rgba(255,255,255,0.06);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 13px;
    font-family: 'DM Sans', sans-serif;
    font-weight: 600; font-size: 15px;
    cursor: pointer;
    margin-top: 8px;
  }

  /* DETAIL VIEW */
  .detail-photos { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 12px 0; }
  .detail-photo-wrap { position: relative; }
  .detail-photo-label {
    position: absolute; bottom: 8px; left: 8px;
    background: rgba(0,0,0,0.65);
    color: #fff; font-size: 11px;
    padding: 3px 8px; border-radius: 6px;
  }
  .detail-photo { width: 100%; border-radius: 12px; height: 140px; object-fit: cover; }

  .detail-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 11px 0;
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }
  .detail-row:last-child { border-bottom: none; }
  .detail-key { font-size: 13px; color: var(--muted); }
  .detail-val { font-size: 14px; font-weight: 500; text-align: right; max-width: 60%; }
  .price-big {
    font-family: 'Playfair Display', serif;
    font-size: 32px;
    color: var(--success);
    text-align: center;
    margin: 16px 0 8px;
  }
  .price-label { text-align: center; font-size: 12px; color: var(--muted); margin-bottom: 16px; }

  /* EMPTY STATE */
  .empty {
    text-align: center;
    padding: 60px 20px;
  }
  .empty-emoji { font-size: 56px; margin-bottom: 16px; }
  .empty h3 { font-family: 'Playfair Display', serif; font-size: 20px; color: var(--accent); margin-bottom: 8px; }
  .empty p { color: var(--muted); font-size: 14px; line-height: 1.6; }

  /* SEARCH */
  .search-bar {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 11px 14px;
    width: 100%; color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    outline: none;
    margin-bottom: 16px;
  }

  /* FILTER CHIPS */
  .filter-chips { display: flex; gap: 8px; margin-bottom: 16px; overflow-x: auto; padding-bottom: 4px; }
  .chip {
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--muted);
    border-radius: 20px;
    padding: 6px 14px;
    font-size: 13px;
    white-space: nowrap;
    cursor: pointer;
    transition: all 0.2s;
  }
  .chip.active { background: rgba(232,168,124,0.15); border-color: var(--accent); color: var(--accent); }

  .section-title {
    font-family: 'Playfair Display', serif;
    font-size: 16px; color: var(--accent);
    margin-bottom: 14px; margin-top: 4px;
  }

  /* TOGGLE */
  .toggle-wrap { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; }
  .toggle-label { font-size: 14px; color: var(--text); }
  .toggle {
    width: 46px; height: 26px;
    background: var(--border);
    border-radius: 13px;
    position: relative; cursor: pointer;
    transition: background 0.2s;
    border: none;
    flex-shrink: 0;
  }
  .toggle.on { background: var(--success); }
  .toggle::after {
    content: '';
    position: absolute;
    width: 20px; height: 20px;
    background: #fff;
    border-radius: 50%;
    top: 3px; left: 3px;
    transition: transform 0.2s;
  }
  .toggle.on::after { transform: translateX(20px); }

  /* CHART */
  .earnings-chart {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 16px;
  }
  .chart-bars { display: flex; align-items: flex-end; gap: 6px; height: 100px; margin-top: 12px; }
  .chart-bar-wrap { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .chart-bar {
    width: 100%;
    border-radius: 6px 6px 0 0;
    background: linear-gradient(180deg, var(--accent), rgba(232,168,124,0.4));
    min-height: 4px;
    transition: height 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .chart-month { font-size: 10px; color: var(--muted); }

  .no-photo-placeholder {
    width: 100%; height: 140px;
    background: rgba(255,255,255,0.04);
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    color: var(--muted); font-size: 28px;
    border: 1px dashed var(--border);
  }
</style>
</head>
<body>

<!-- HEADER -->
<div class="app-header">
  <h1>🐾 Pet Kuaför</h1>
  <button class="btn-new" onclick="openNewModal()">+ Randevu</button>
</div>

<!-- PAGES -->
<div id="page-home" class="page active">
  <input class="search-bar" placeholder="🔍 Köpek veya sahip ara..." oninput="renderHome(this.value)">
  <div class="filter-chips">
    <div class="chip active" onclick="setFilter('all',this)">Tümü</div>
    <div class="chip" onclick="setFilter('pending',this)">Bekleyen</div>
    <div class="chip" onclick="setFilter('completed',this)">Tamamlanan</div>
  </div>
  <div id="appt-list"></div>
</div>

<div id="page-stats" class="page">
  <p class="section-title">Kazanç Özeti</p>
  <div class="stats-grid" id="stats-grid"></div>
  <div class="earnings-chart">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <span style="font-size:13px;color:var(--muted)">Son 6 Ay Kazanç</span>
    </div>
    <div class="chart-bars" id="chart-bars"></div>
  </div>
  <p class="section-title">En Çok Gelen Köpekler</p>
  <div id="top-dogs"></div>
</div>

<div id="page-history" class="page">
  <p class="section-title">Tüm Randevular</p>
  <div id="history-list"></div>
</div>

<!-- BOTTOM NAV -->
<div class="bottom-nav">
  <button class="nav-item active" onclick="showPage('home',this)">
    <span class="icon">🏠</span>Ana Sayfa
  </button>
  <button class="nav-item" onclick="showPage('stats',this)">
    <span class="icon">📊</span>İstatistik
  </button>
  <button class="nav-item" onclick="showPage('history',this)">
    <span class="icon">📋</span>Geçmiş
  </button>
</div>

<!-- NEW/EDIT APPOINTMENT MODAL -->
<div class="modal-overlay" id="modal-new">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title" id="modal-title">Yeni Randevu</div>
    <div class="modal-body">
      <!-- RANDEVU BİLGİLERİ -->
      <div class="form-section">
        <div class="form-section-title">📅 Randevu Zamanı</div>
        <div class="input-row">
          <div>
            <label>Tarih</label>
            <input type="date" id="f-date">
          </div>
          <div>
            <label>Saat</label>
            <input type="time" id="f-time">
          </div>
        </div>
      </div>

      <!-- KÖPEk BİLGİLERİ -->
      <div class="form-section">
        <div class="form-section-title">🐶 Köpek Bilgileri</div>
        <label>Köpeğin Adı *</label>
        <input type="text" id="f-dog-name" placeholder="ör. Karamel">
        <label>Irk</label>
        <input type="text" id="f-breed" placeholder="ör. Golden Retriever">
        <div class="input-row">
          <div>
            <label>Yaş</label>
            <input type="text" id="f-age" placeholder="ör. 3">
          </div>
          <div>
            <label>Cinsiyet</label>
            <select id="f-gender">
              <option value="">Seçin</option>
              <option>Erkek</option>
              <option>Dişi</option>
            </select>
          </div>
        </div>
        <label>Karakter / Notlar</label>
        <textarea id="f-character" placeholder="ör. Sakin, makastan korkar, sosyal..."></textarea>
      </div>

      <!-- SAHİP BİLGİLERİ -->
      <div class="form-section">
        <div class="form-section-title">👤 Sahip Bilgileri</div>
        <label>Sahibinin Adı *</label>
        <input type="text" id="f-owner" placeholder="ör. Ahmet Yılmaz">
        <label>Telefon</label>
        <input type="tel" id="f-phone" placeholder="ör. 0532 123 45 67">
      </div>

      <!-- İŞLEM SONUÇLARI -->
      <div class="form-section">
        <div class="form-section-title">✂️ İşlem Bilgileri</div>
        <div class="toggle-wrap">
          <span class="toggle-label">Randevu Tamamlandı</span>
          <button class="toggle" id="f-completed" onclick="toggleCompleted(this)"></button>
        </div>
        <div id="completed-fields" style="display:none">
          <div class="input-row" style="margin-top:10px">
            <div>
              <label>Ücret (₺)</label>
              <input type="number" id="f-price" placeholder="ör. 350">
            </div>
            <div>
              <label>Süre (saat)</label>
              <input type="number" id="f-duration" step="0.5" placeholder="ör. 2">
            </div>
          </div>
          <label>Yapılan İşlemler</label>
          <textarea id="f-services" placeholder="ör. Banyo, tıraş, tırnak kesimi..."></textarea>
        </div>
      </div>

      <!-- FOTOĞRAFLAR -->
      <div class="form-section">
        <div class="form-section-title">📸 Fotoğraflar</div>
        <div class="photo-grid">
          <div>
            <label>Öncesi</label>
            <div class="photo-upload-area" onclick="triggerPhoto('before')">
              <input type="file" id="f-photo-before" accept="image/*" capture="environment" onchange="previewPhoto(this,'prev-before')">
              <div id="prev-before-wrap">
                <div style="font-size:24px">📷</div>
                <div style="font-size:12px;color:var(--muted);margin-top:4px">Fotoğraf Ekle</div>
              </div>
            </div>
          </div>
          <div>
            <label>Sonrası</label>
            <div class="photo-upload-area" onclick="triggerPhoto('after')">
              <input type="file" id="f-photo-after" accept="image/*" capture="environment" onchange="previewPhoto(this,'prev-after')">
              <div id="prev-after-wrap">
                <div style="font-size:24px">📷</div>
                <div style="font-size:12px;color:var(--muted);margin-top:4px">Fotoğraf Ekle</div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <button class="btn-primary" onclick="saveAppointment()">💾 Kaydet</button>
      <button class="btn-secondary" onclick="closeModal('modal-new')">İptal</button>
    </div>
  </div>
</div>

<!-- DETAIL MODAL -->
<div class="modal-overlay" id="modal-detail">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title" id="detail-title"></div>
    <div class="modal-body" id="detail-body"></div>
  </div>
</div>

<script>
const DB_KEY = 'pet_kuafor_appointments';
let appointments = [];
let currentFilter = 'all';
let editingId = null;
let photoDataBefore = null;
let photoDataAfter = null;

// LOAD
function load() {
  try {
    appointments = JSON.parse(localStorage.getItem(DB_KEY)) || [];
  } catch { appointments = []; }
}
function save() {
  localStorage.setItem(DB_KEY, JSON.stringify(appointments));
}

// PAGES
function showPage(name, el) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  document.getElementById('page-' + name).classList.add('active');
  el.classList.add('active');
  if (name === 'stats') renderStats();
  if (name === 'history') renderHistory();
  if (name === 'home') renderHome();
}

// FILTER
function setFilter(f, el) {
  currentFilter = f;
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  renderHome();
}

// RENDER HOME
function renderHome(search = '') {
  let list = [...appointments].sort((a,b) => new Date(b.date+' '+b.time) - new Date(a.date+' '+a.time));
  if (currentFilter === 'pending') list = list.filter(a => !a.completed);
  if (currentFilter === 'completed') list = list.filter(a => a.completed);
  if (search) {
    const q = search.toLowerCase();
    list = list.filter(a =>
      (a.dogName||'').toLowerCase().includes(q) ||
      (a.owner||'').toLowerCase().includes(q) ||
      (a.breed||'').toLowerCase().includes(q)
    );
  }
  const el = document.getElementById('appt-list');
  if (!list.length) {
    el.innerHTML = `<div class="empty"><div class="empty-emoji">🐾</div><h3>Randevu Bulunamadı</h3><p>Yeni randevu eklemek için<br>sağ üstteki butona dokun.</p></div>`;
    return;
  }
  el.innerHTML = list.map(a => `
    <div class="appt-card ${a.completed?'completed':'pending'}" onclick="openDetail('${a.id}')">
      <div class="card-header">
        <div class="dog-name">${a.dogName || '?'}</div>
        <span class="badge ${a.completed?'completed':'pending'}">${a.completed?'✓ Tamamlandı':'⏳ Bekliyor'}</span>
      </div>
      <div class="card-row">
        <div class="card-info">📅 <strong>${formatDate(a.date)}</strong></div>
        <div class="card-info">🕐 <strong>${a.time||'?'}</strong></div>
        ${a.completed && a.price ? `<div class="card-info">💰 <strong>${a.price}₺</strong></div>` : ''}
      </div>
      <div class="card-row" style="margin-top:6px">
        ${a.breed ? `<div class="card-info">🐶 ${a.breed}</div>` : ''}
        <div class="card-info">👤 ${a.owner||'Belirtilmemiş'}</div>
      </div>
    </div>
  `).join('');
}

// DETAIL
function openDetail(id) {
  const a = appointments.find(x => x.id === id);
  if (!a) return;
  document.getElementById('detail-title').textContent = `🐾 ${a.dogName||'Randevu'}`;
  let html = '';

  if (a.completed && a.price) {
    html += `<div class="price-big">${a.price}₺</div><div class="price-label">Alınan Ücret</div>`;
  }

  if (a.photoBefore || a.photoAfter) {
    html += `<div class="detail-photos">`;
    html += a.photoBefore
      ? `<div class="detail-photo-wrap"><img class="detail-photo" src="${a.photoBefore}"><span class="detail-photo-label">Öncesi</span></div>`
      : `<div class="no-photo-placeholder">📷</div>`;
    html += a.photoAfter
      ? `<div class="detail-photo-wrap"><img class="detail-photo" src="${a.photoAfter}"><span class="detail-photo-label">Sonrası</span></div>`
      : `<div class="no-photo-placeholder">📷</div>`;
    html += `</div>`;
  }

  const rows = [
    ['📅 Tarih', formatDate(a.date)],
    ['🕐 Saat', a.time],
    ['🐶 Irk', a.breed],
    ['🎂 Yaş', a.age],
    ['⚧ Cinsiyet', a.gender],
    ['💬 Karakter', a.character],
    ['👤 Sahip', a.owner],
    ['📱 Telefon', a.phone ? `<a href="tel:${a.phone}" style="color:var(--accent)">${a.phone}</a>` : null],
    ['⏱ Süre', a.duration ? `${a.duration} saat` : null],
    ['✂️ İşlemler', a.services],
    ['✅ Durum', a.completed ? '<span style="color:var(--success)">Tamamlandı</span>' : '<span style="color:var(--accent)">Bekliyor</span>'],
  ];
  html += rows.filter(r => r[1]).map(r =>
    `<div class="detail-row"><span class="detail-key">${r[0]}</span><span class="detail-val">${r[1]}</span></div>`
  ).join('');

  html += `<button class="btn-secondary" onclick="editAppointment('${a.id}');closeModal('modal-detail')">✏️ Düzenle</button>`;
  html += `<button class="btn-danger" onclick="deleteAppointment('${a.id}')">🗑 Randevuyu Sil</button>`;
  html += `<button class="btn-secondary" onclick="closeModal('modal-detail')" style="margin-top:4px">Kapat</button>`;

  document.getElementById('detail-body').innerHTML = html;
  openModal('modal-detail');
}

// NEW MODAL
function openNewModal() {
  editingId = null;
  photoDataBefore = null;
  photoDataAfter = null;
  document.getElementById('modal-title').textContent = 'Yeni Randevu';
  clearForm();
  // set today
  document.getElementById('f-date').value = new Date().toISOString().split('T')[0];
  openModal('modal-new');
}

function editAppointment(id) {
  const a = appointments.find(x => x.id === id);
  if (!a) return;
  editingId = id;
  photoDataBefore = a.photoBefore || null;
  photoDataAfter = a.photoAfter || null;
  document.getElementById('modal-title').textContent = 'Randevuyu Düzenle';
  document.getElementById('f-date').value = a.date || '';
  document.getElementById('f-time').value = a.time || '';
  document.getElementById('f-dog-name').value = a.dogName || '';
  document.getElementById('f-breed').value = a.breed || '';
  document.getElementById('f-age').value = a.age || '';
  document.getElementById('f-gender').value = a.gender || '';
  document.getElementById('f-character').value = a.character || '';
  document.getElementById('f-owner').value = a.owner || '';
  document.getElementById('f-phone').value = a.phone || '';
  document.getElementById('f-price').value = a.price || '';
  document.getElementById('f-duration').value = a.duration || '';
  document.getElementById('f-services').value = a.services || '';
  const toggle = document.getElementById('f-completed');
  if (a.completed) { toggle.classList.add('on'); document.getElementById('completed-fields').style.display = ''; }
  else { toggle.classList.remove('on'); document.getElementById('completed-fields').style.display = 'none'; }

  // photos
  if (a.photoBefore) {
    document.getElementById('prev-before-wrap').innerHTML = `<img class="photo-preview" src="${a.photoBefore}">`;
  }
  if (a.photoAfter) {
    document.getElementById('prev-after-wrap').innerHTML = `<img class="photo-preview" src="${a.photoAfter}">`;
  }
  openModal('modal-new');
}

function saveAppointment() {
  const dogName = document.getElementById('f-dog-name').value.trim();
  const owner = document.getElementById('f-owner').value.trim();
  if (!dogName) { alert('Köpek adı zorunludur!'); return; }

  const isCompleted = document.getElementById('f-completed').classList.contains('on');
  const appt = {
    id: editingId || Date.now().toString(),
    date: document.getElementById('f-date').value,
    time: document.getElementById('f-time').value,
    dogName,
    breed: document.getElementById('f-breed').value,
    age: document.getElementById('f-age').value,
    gender: document.getElementById('f-gender').value,
    character: document.getElementById('f-character').value,
    owner,
    phone: document.getElementById('f-phone').value,
    completed: isCompleted,
    price: isCompleted ? document.getElementById('f-price').value : '',
    duration: isCompleted ? document.getElementById('f-duration').value : '',
    services: isCompleted ? document.getElementById('f-services').value : '',
    photoBefore: photoDataBefore,
    photoAfter: photoDataAfter,
    createdAt: editingId ? (appointments.find(a=>a.id===editingId)||{}).createdAt : Date.now()
  };

  if (editingId) {
    appointments = appointments.map(a => a.id === editingId ? appt : a);
  } else {
    appointments.unshift(appt);
  }
  save();
  closeModal('modal-new');
  renderHome();
}

function deleteAppointment(id) {
  if (!confirm('Bu randevuyu silmek istediğinize emin misiniz?')) return;
  appointments = appointments.filter(a => a.id !== id);
  save();
  closeModal('modal-detail');
  renderHome();
}

// TOGGLE
function toggleCompleted(btn) {
  btn.classList.toggle('on');
  document.getElementById('completed-fields').style.display =
    btn.classList.contains('on') ? '' : 'none';
}

// PHOTOS
function triggerPhoto(type) {
  document.getElementById('f-photo-' + type).click();
}
function previewPhoto(input, wrapId) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    const data = e.target.result;
    if (input.id === 'f-photo-before') photoDataBefore = data;
    else photoDataAfter = data;
    document.getElementById(wrapId + '-wrap').innerHTML =
      `<img class="photo-preview" src="${data}">`;
  };
  reader.readAsDataURL(file);
}

// STATS
function renderStats() {
  const completed = appointments.filter(a => a.completed);
  const totalEarnings = completed.reduce((s,a) => s + (parseFloat(a.price)||0), 0);
  const totalHours = completed.reduce((s,a) => s + (parseFloat(a.duration)||0), 0);
  document.getElementById('stats-grid').innerHTML = `
    <div class="stat-card"><div class="stat-num">${appointments.length}</div><div class="stat-label">Toplam Randevu</div></div>
    <div class="stat-card"><div class="stat-num">${completed.length}</div><div class="stat-label">Tamamlanan</div></div>
    <div class="stat-card"><div class="stat-num">${totalEarnings.toLocaleString('tr-TR')}₺</div><div class="stat-label">Toplam Kazanç</div></div>
    <div class="stat-card"><div class="stat-num">${totalHours}h</div><div class="stat-label">Toplam Süre</div></div>
  `;

  // monthly chart
  const months = [];
  for (let i = 5; i >= 0; i--) {
    const d = new Date(); d.setMonth(d.getMonth() - i);
    months.push({ key: `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`, label: d.toLocaleString('tr-TR',{month:'short'}) });
  }
  const monthlyEarnings = months.map(m => {
    return completed.filter(a => a.date && a.date.startsWith(m.key))
      .reduce((s,a) => s + (parseFloat(a.price)||0), 0);
  });
  const maxE = Math.max(...monthlyEarnings, 1);
  document.getElementById('chart-bars').innerHTML = months.map((m,i) => `
    <div class="chart-bar-wrap">
      <div class="chart-bar" style="height:${Math.max(4,(monthlyEarnings[i]/maxE*90))}px" title="${monthlyEarnings[i]}₺"></div>
      <span class="chart-month">${m.label}</span>
    </div>
  `).join('');

  // top dogs
  const freq = {};
  appointments.forEach(a => {
    const k = (a.dogName||'?') + (a.breed ? ` (${a.breed})` : '');
    freq[k] = (freq[k]||0)+1;
  });
  const sorted = Object.entries(freq).sort((a,b) => b[1]-a[1]).slice(0,5);
  document.getElementById('top-dogs').innerHTML = sorted.length
    ? sorted.map(([name,count]) => `
      <div class="appt-card" style="cursor:default">
        <div class="card-header">
          <span class="dog-name" style="font-size:15px">${name}</span>
          <span class="badge pending">${count} randevu</span>
        </div>
      </div>`).join('')
    : '<div style="color:var(--muted);text-align:center;padding:20px">Henüz yeterli veri yok.</div>';
}

// HISTORY
function renderHistory() {
  const list = [...appointments].sort((a,b) => new Date(b.date+' '+b.time) - new Date(a.date+' '+a.time));
  if (!list.length) {
    document.getElementById('history-list').innerHTML = `<div class="empty"><div class="empty-emoji">📋</div><h3>Geçmiş Boş</h3><p>Randevular burada görünecek.</p></div>`;
    return;
  }
  document.getElementById('history-list').innerHTML = list.map(a => `
    <div class="appt-card ${a.completed?'completed':'pending'}" onclick="openDetail('${a.id}')">
      <div class="card-header">
        <div class="dog-name">${a.dogName || '?'}</div>
        <span class="badge ${a.completed?'completed':'pending'}">${a.completed?'✓':'⏳'}</span>
      </div>
      <div class="card-row">
        <div class="card-info">📅 <strong>${formatDate(a.date)}</strong></div>
        <div class="card-info">👤 ${a.owner||'-'}</div>
        ${a.price ? `<div class="card-info">💰 <strong>${a.price}₺</strong></div>` : ''}
      </div>
    </div>
  `).join('');
}

// HELPERS
function openModal(id) { document.getElementById(id).classList.add('open'); }
function closeModal(id) { document.getElementById(id).classList.remove('open'); }
function clearForm() {
  ['f-date','f-time','f-dog-name','f-breed','f-age','f-character','f-owner','f-phone','f-price','f-duration','f-services'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.value = '';
  });
  document.getElementById('f-gender').value = '';
  document.getElementById('f-completed').classList.remove('on');
  document.getElementById('completed-fields').style.display = 'none';
  document.getElementById('prev-before-wrap').innerHTML = '<div style="font-size:24px">📷</div><div style="font-size:12px;color:var(--muted);margin-top:4px">Fotoğraf Ekle</div>';
  document.getElementById('prev-after-wrap').innerHTML = '<div style="font-size:24px">📷</div><div style="font-size:12px;color:var(--muted);margin-top:4px">Fotoğraf Ekle</div>';
}
function formatDate(d) {
  if (!d) return '-';
  try {
    return new Date(d + 'T00:00:00').toLocaleDateString('tr-TR',{day:'numeric',month:'long',year:'numeric'});
  } catch { return d; }
}

// Close modal on overlay click
document.querySelectorAll('.modal-overlay').forEach(overlay => {
  overlay.addEventListener('click', e => {
    if (e.target === overlay) overlay.classList.remove('open');
  });
});

// INIT
load();
renderHome();
</script>
</body>
</html>
